<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mappa posizione Parrucchiere MINA a Novara</title>
  <desc id="desc">Mappa grafica della posizione in Corso Giuseppe Mazzini 21/A, Novara.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#302a26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2e6da"/>
      <stop offset="1" stop-color="#e5d5c5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- blocchi urbani astratti -->
  <g fill="#d7c6b5" opacity="0.95">
    <rect x="30" y="35" width="250" height="150" rx="24"/>
    <rect x="330" y="35" width="220" height="150" rx="24"/>
    <rect x="845" y="35" width="325" height="150" rx="24"/>
    <rect x="30" y="250" width="310" height="190" rx="26"/>
    <rect x="845" y="250" width="325" height="190" rx="26"/>
    <rect x="35" y="540" width="270" height="175" rx="26"/>
    <rect x="365" y="540" width="250" height="175" rx="26"/>
    <rect x="830" y="540" width="340" height="175" rx="26"/>
  </g>

  <!-- vie secondarie -->
  <g stroke="#fffaf4" stroke-width="42" stroke-linecap="round" fill="none">
    <path d="M0 215 H1200"/>
    <path d="M0 490 H1200"/>
    <path d="M305 0 V760"/>
    <path d="M805 0 V760"/>
  </g>
  <g stroke="#c8b4a1" stroke-width="2" stroke-dasharray="10 10" opacity="0.9">
    <path d="M0 215 H1200"/><path d="M0 490 H1200"/><path d="M305 0 V760"/><path d="M805 0 V760"/>
  </g>

  <!-- Corso Mazzini -->
  <path d="M605 -30 C570 120 565 250 600 370 C635 490 630 625 590 800" fill="none" stroke="#fffaf4" stroke-width="100" stroke-linecap="round"/>
  <path d="M605 -30 C570 120 565 250 600 370 C635 490 630 625 590 800" fill="none" stroke="#bda994" stroke-width="3" stroke-dasharray="16 16" opacity="0.95"/>

  <!-- parco/area verde -->
  <path d="M860 282 C930 245 1060 255 1125 315 C1160 350 1145 412 1090 432 C1015 458 895 442 856 392 C830 358 829 310 860 282Z" fill="#e2d4c7"/>
  <circle cx="910" cy="334" r="15" fill="#c9b39f"/><circle cx="980" cy="387" r="18" fill="#c9b39f"/><circle cx="1070" cy="325" r="16" fill="#c9b39f"/>

  <!-- etichette -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#74655a">
    <text x="640" y="150" font-size="26" transform="rotate(4 640 150)">Corso Giuseppe Mazzini</text>
    <text x="63" y="180" font-size="22">Centro di Novara</text>
    <text x="900" y="390" font-size="20">Novara</text>
  </g>

  <!-- marker -->
  <g transform="translate(598 365)" filter="url(#shadow)">
    <path d="M0 -100 C-51 -100 -92 -59 -92 -8 C-92 61 0 151 0 151 C0 151 92 61 92 -8 C92 -59 51 -100 0 -100Z" fill="#9b7558"/>
    <circle cx="0" cy="-8" r="42" fill="#fbf5ee"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#836273">M</text>
  </g>

  <!-- card posizione -->
  <g filter="url(#shadow)">
    <rect x="705" y="555" width="415" height="135" rx="28" fill="#fbf5ee"/>
    <circle cx="755" cy="608" r="24" fill="#9b7558"/>
    <circle cx="755" cy="608" r="8" fill="#fbf5ee"/>
    <text x="800" y="600" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#302a26">Parrucchiere MINA</text>
    <text x="800" y="635" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#665c54">Corso Giuseppe Mazzini 21/A</text>
    <text x="800" y="663" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8b6b7a">Novara</text>
  </g>

  <text x="45" y="730" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#7d6f65">Mappa grafica della posizione • Tocca “Apri in Google Maps” per navigazione e indicazioni reali</text>
</svg>
